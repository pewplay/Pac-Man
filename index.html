<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Pac-Man</title>
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="icon/ios_icon.png">
    <link rel="icon" type="image/png" href="icon/favicon.png">
    <style>
        @font-face {
            font-family: 'ArcadeR';
            src: url('font/ARCADE_R.TTF');
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background: #000;
            overscroll-behavior: none;
        }
        body {
            position: fixed;
            inset: 0;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'ArcadeR', monospace;
        }
        #canvas {
            position: absolute;
            left: 0;
            top: 0;
            display: block;
            touch-action: none;
            outline: none;
        }
        #font-preload {
            position: absolute;
            left: -9999px;
            top: 0;
            font-family: 'ArcadeR';
        }
        #canvas-warning {
            color: #FF0;
            font-size: 1.5em;
        }
        #pp-safe {
            position: fixed;
            inset: 0;
            visibility: hidden;
            pointer-events: none;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        #pp-controls {
            position: absolute;
            display: none;
            pointer-events: none;
        }
        #pp-row {
            position: absolute;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 16px;
            pointer-events: none;
        }
        .pp-btn {
            pointer-events: auto;
            width: 44px;
            height: 44px;
            padding: 9px;
            margin: 0;
            border: 2px solid rgba(33, 33, 255, 0.85);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.6);
            color: #ffb8ae;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .pp-btn svg {
            display: block;
            width: 100%;
            height: 100%;
        }
        .pp-btn:hover, .pp-btn:focus-visible {
            color: #ffff00;
            border-color: #4a4aff;
            outline: none;
        }
        .pp-btn:active {
            background: rgba(33, 33, 255, 0.35);
        }
        .pp-corner {
            position: fixed;
            z-index: 5;
            opacity: 0.7;
        }
        .pp-corner:hover {
            opacity: 1;
        }
        #pp-dpad {
            position: absolute;
            pointer-events: auto;
            touch-action: none;
            border-radius: 50%;
        }
        #pp-dpad svg {
            display: block;
            width: 100%;
            height: 100%;
            overflow: visible;
        }
        #pp-dpad .pp-ring {
            fill: rgba(33, 33, 255, 0.08);
            stroke: rgba(33, 33, 255, 0.55);
            stroke-width: 2;
        }
        #pp-dpad .pp-cross {
            fill: rgba(255, 255, 255, 0.06);
            stroke: rgba(33, 33, 255, 0.9);
            stroke-width: 2;
            stroke-linejoin: round;
        }
        #pp-dpad .pp-hub {
            fill: rgba(33, 33, 255, 0.5);
        }
        #pp-dpad .pp-arrow {
            fill: rgba(255, 184, 174, 0.75);
            transition: fill 0.08s;
        }
        #pp-dpad .pp-arrow.on {
            fill: #ffff00;
        }
        .pp-hidden {
            visibility: hidden !important;
        }
        #pp-pause.pp-hidden {
            display: none;
        }
        #pp-paused {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            cursor: pointer;
        }
        #pp-paused .pp-ptitle {
            font-size: 28px;
            color: #ffff00;
            letter-spacing: 2px;
        }
        #pp-paused .pp-psub {
            margin-top: 16px;
            font-size: 14px;
            color: #ddd;
        }
    </style>
    <script src="pacman.js"></script>
</head>
<body>
    <div id="font-preload">Pac-Man</div>
    <canvas id="canvas" tabindex="-1"><div id="canvas-warning">Your browser does not support HTML Canvas. Please update your browser.</div></canvas>
    <canvas id="atlas" style="display:none"></canvas>
</body>
</html>
